spring:
  application:
    name: api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seu_banco}
    username : ${DB_USERNAME:postgres}
    password : ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        generate_statistics: true

  flyway:
    enabled: true

api:
  security:
    jwt:
      secret: ${JWT_SECRET:chave-super-secreta}
      google-issuer: https://accounts.google.com
      local-issuer: http://localhost:8080
      local-expiration: 3600 # 1 hora


server:
  port: 8080

springdoc:
  swagger-ui:
    path: /api/docs
    operationsSorter: method