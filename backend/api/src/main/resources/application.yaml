spring:
  application:
    name: api

  datasource:
    url: ${DB_URL}
    username : ${DB_USERNAME}
    password : ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        generate_statistics: true

  flyway:
    enabled: true


server:
  port: 8080

springdoc:
  swagger-ui:
    path: /api/docs
    operationsSorter: method